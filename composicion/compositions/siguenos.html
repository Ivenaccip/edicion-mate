<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "InterLocal"; src: url("../vendor/Inter-ExtraBold.otf") format("opentype"); font-weight: 400 900; }
      :root { --azul: #2f8fff; --font: "InterLocal", "DejaVu Sans", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #siguenos { position: relative; width: 1080px; height: 1920px; font-family: var(--font); }
      /* Un solo botón, centrado en la franja superior libre */
      #boton { position: absolute; left: 50%; top: 420px; width: 520px; height: 132px; margin-left: -260px; border-radius: 66px;
        background: var(--azul); color: #fff; font-size: 56px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 20px;
        box-shadow: 0 18px 44px rgba(47,143,255,.45); }
      #boton .mas { font-size: 68px; line-height: 1; margin-top: -6px; }
      #boton.listo { background: #22c55e; box-shadow: 0 18px 44px rgba(34,197,94,.45); }
      #cursor { position: absolute; left: 720px; top: 980px; width: 84px; height: 84px; opacity: 0; }
      #cursor svg { width: 84px; height: 84px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
      #onda { position: absolute; left: 50%; top: 486px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 6px solid #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="siguenos" data-composition-id="siguenos" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="boton" class="clip" data-start="0" data-duration="4" data-track-index="0"><span class="mas">+</span><span class="txt">Seguir</span></div>
      <div id="onda"></div>
      <div id="cursor" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 8z" fill="#fff" stroke="#1b1b1f" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 0.0 el botón ya está; 0.35 el cursor aparece abajo a la derecha y viaja al botón; 1.3 clic: se hunde, cambia a Siguiendo, onda.
      tl.fromTo("#boton", { scale: 0.96 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.35);
      tl.to("#cursor", { x: -160, y: -490, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to("#boton", { scale: 0.92, duration: 0.08, ease: "power1.in" }, 1.3);
      tl.to("#boton", { scale: 1.04, duration: 0.18, ease: "back.out(3)" }, 1.38);
      tl.to("#boton", { scale: 1, duration: 0.15 }, 1.56);
      tl.set("#boton", { className: "listo" }, 1.38);
      tl.set("#boton .txt", { textContent: "Siguiendo" }, 1.38);
      tl.set("#boton .mas", { textContent: "✓" }, 1.38);
      tl.fromTo("#onda", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 16, duration: 0.7, ease: "power2.out" }, 1.36);
      tl.to("#cursor", { opacity: 0, duration: 0.3 }, 1.9);
      window.__timelines["siguenos"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
