<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "InterLocal"; src: url("./vendor/Inter-ExtraBold.otf") format("opentype"); font-weight: 400 900; }
      /* v3: cuerpo completo (33.27 s) con los 4 b-roll del usuario, contadores en HTML y botón "Síguenos".
         Sin captions todavía (van al final, cuando llegue la spec). Tiempos = tiempo del cuerpo (EDL aplicado). */
      :root {
        --crema: #f1ece3; --tinta: #1b1b1f; --azul: #2f8fff; --naranja: #e07b4a;
        --font: "InterLocal", "DejaVu Sans", sans-serif;
        --tarjeta-y: 1350px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--crema); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: var(--font); }
      .capa { position: absolute; inset: 0; width: 1080px; height: 1920px; }

      /* Capa 0: fondo claro permanente */
      #fondo { z-index: 0; background: radial-gradient(120% 80% at 50% 20%, #fbf8f2 0%, var(--crema) 55%, #e4dccf 100%); }

      /* Capa 1: b-roll. Dos formas: "ventana" (clips horizontales, tarjeta flotante 16:9 arriba) y "lleno" (clips verticales a pantalla completa). */
      .ventana { position: absolute; left: 140px; top: 250px; width: 800px; height: 450px; border-radius: 28px; object-fit: cover;
        box-shadow: 0 30px 80px rgba(0,0,0,.28); background: #000; z-index: 1; }
      .lleno { z-index: 1; position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* Título de apertura (plano 1-2), sobre fondo abstracto hecho en CSS */
      #titulo { z-index: 1; position: absolute; left: 140px; top: 250px; width: 800px; height: 450px; border-radius: 28px; overflow: hidden;
        background: radial-gradient(60% 80% at 20% 30%, #ff9a5c 0%, var(--naranja) 30%, #1b2a4a 70%, #0d1424 100%);
        box-shadow: 0 30px 80px rgba(0,0,0,.28); color: #fff; }
      #titulo h1 { position: absolute; left: 48px; right: 48px; top: 100px; font-size: 96px; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; }
      #titulo .aster { position: absolute; right: 48px; bottom: 36px; width: 120px; height: 120px; }

      /* Contadores sobre el b-roll (planos 6, 8, 9, 10) */
      /* Contadores: siempre en la franja superior (y 330-560), libre de la persona, en blanco con sombra sobre cualquier b-roll */
      .contador { z-index: 2; position: absolute; left: 180px; width: 760px; top: 330px; text-align: left; color: #fff; opacity: 0;
        text-shadow: 0 4px 18px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.8); }
      .contador b { display: block; font-size: 150px; line-height: 1; letter-spacing: -0.04em; }
      .contador span { display: block; font-size: 44px; font-weight: 700; margin-top: 10px; color: #f0f0f4; }

      /* Capa 2: tarjeta cálida + sombra; capa 3: persona (WebM con alfa, chromakey por zonas + despill) */
      #tarjeta { z-index: 3; position: absolute; left: 0; right: 0; top: var(--tarjeta-y); bottom: 0; border-radius: 56px 56px 0 0; overflow: hidden;
        background:
          radial-gradient(140px 140px at 18% 35%, rgba(255,190,120,.55) 0%, rgba(255,190,120,0) 70%),
          radial-gradient(110px 110px at 82% 25%, rgba(255,160,90,.5) 0%, rgba(255,160,90,0) 70%),
          radial-gradient(180px 180px at 60% 70%, rgba(255,210,150,.35) 0%, rgba(255,210,150,0) 70%),
          radial-gradient(90px 90px at 35% 80%, rgba(255,140,80,.45) 0%, rgba(255,140,80,0) 70%),
          linear-gradient(180deg, #3a2a22 0%, #2a1d18 100%);
        box-shadow: 0 -20px 60px rgba(0,0,0,.25); }
      #sombra { z-index: 4; position: absolute; left: 140px; right: 140px; top: 1500px; height: 420px;
        background: radial-gradient(60% 50% at 50% 60%, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 70%); }
      #persona { z-index: 5; object-fit: cover; filter: saturate(1.3) contrast(1.06) brightness(1.02); }

      /* Capa 6: sub-composición "Síguenos" (planos 14-16) */
      #siguenos { z-index: 6; position: absolute; inset: 0; }

      /* Capa 7: logo blanco fijo, abajo a la derecha pero dentro de la zona segura (margen derecho 108 px,
         por encima de la banda inferior que tapan TikTok/Reels/Shorts). Sombra suave por si la libreta o una
         mano clara pasan debajo. */
      #logo { z-index: 7; position: absolute; right: 108px; top: 1370px; width: 260px; height: auto;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.27" data-width="1080" data-height="1920">
      <div id="fondo" class="clip capa" data-start="0" data-duration="33.27" data-track-index="0"></div>

      <!-- Planos 1-2 (0-3.6): título -->
      <div id="titulo" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
        <h1>Estamos<br>de regreso</h1>
        <svg class="aster" viewBox="0 0 100 100"><g fill="#ffb27a"><path d="M46 2h8l-2 40 26-30 6 6-30 26 40-2v8l-40-2 30 26-6 6-26-30 2 40h-8l2-40-26 30-6-6 30-26-40 2v-8l40 2-30-26 6-6 26 30z"/></g></svg>
      </div>

      <!-- Planos 3-4 (3.6-7.6): robots, "mundo de la IA" -->
      <video class="ventana clip" id="v-robots" src="./assets/b1_robots_720.mp4" data-start="3.6" data-duration="4" data-track-index="1" muted playsinline></video>
      <!-- Planos 5-6 (7.6-11.6): clase, "hemos capacitado a más de 50,000 personas" -->
      <video class="ventana clip" id="v-aula" src="./assets/b4_aula_720.mp4" data-start="7.6" data-duration="4" data-track-index="1" muted playsinline></video>
      <div class="contador clip" id="c-personas" data-start="9.6" data-duration="2" data-track-index="2"><b>+50,000</b><span>personas capacitadas</span></div>

      <!-- Planos 7-8 (11.6-15.6): globo, "en toda Latinoamérica… más de 70 empresas" -->
      <video class="lleno clip" id="v-globo" src="./assets/b3_globo_1080x1920.mp4" data-start="11.6" data-duration="4" data-track-index="1" muted playsinline></video>
      <div class="contador claro clip" id="c-empresas" data-start="13.6" data-duration="2" data-track-index="2"><b>+70</b><span>empresas impactadas</span></div>

      <!-- Plano 9 (15.6-17.6): público, "más de 10 eventos" -->
      <video class="lleno clip" id="v-publico" src="./assets/b2_publico_1080x1920.mp4" data-start="15.6" data-duration="2" data-track-index="1" muted playsinline></video>
      <div class="contador claro clip" id="c-eventos" data-start="15.6" data-duration="2" data-track-index="2"><b>+10</b><span>eventos</span></div>

      <!-- Plano 10 (17.6-19.6): globo otra vez, "13 países" -->
      <video class="lleno clip" id="v-globo2" src="./assets/b3_globo_1080x1920.mp4" data-start="17.6" data-duration="2" data-media-start="6" data-track-index="1" muted playsinline></video>
      <div class="contador claro clip" id="c-paises" data-start="17.6" data-duration="2" data-track-index="2"><b>13</b><span>países de Latinoamérica</span></div>

      <!-- Plano 11 (19.6-21.8): público, segunda parte -->
      <video class="lleno clip" id="v-publico2" src="./assets/b2_publico_1080x1920.mp4" data-start="19.6" data-duration="2.2" data-media-start="4.5" data-track-index="1" muted playsinline></video>

      <!-- Plano 12 (21.8-27.1): sin b-roll, persona a cámara. Planos 14-16 (27.1-33.27): Síguenos -->
      <div id="siguenos" class="clip" data-composition-id="siguenos" data-composition-src="compositions/siguenos.html" data-start="27.1" data-duration="6.17" data-track-index="6"></div>

      <div id="tarjeta" class="clip" data-start="0" data-duration="33.27" data-track-index="3"></div>
      <div id="sombra"></div>
      <video id="persona" class="clip capa" src="./assets/persona_cuerpo_alfa.webm" data-start="0" data-duration="33.27" data-track-index="4" muted playsinline></video>
      <audio id="voz" src="./assets/voz_cuerpo.m4a" data-start="0" data-duration="33.27" data-track-index="5"></audio>
      <img id="logo" class="clip" src="./assets/logo_blanco.png" data-start="0" data-duration="33.27" data-track-index="7" alt="" />
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const entra = (sel, t, dur = 0.35) => tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: dur, ease: "power3.out" }, t);
      // Frame 0 es la miniatura en redes: persona y título ya visibles; solo un leve asentamiento.
      tl.fromTo("#persona", { y: 12 }, { y: 0, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo("#titulo h1", { y: 14, scale: 0.98 }, { y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#titulo .aster", { rotate: -45 }, { rotate: 0, duration: 0.6, ease: "back.out(2)" }, 0);
      entra("#v-robots", 3.6); entra("#v-aula", 7.6);
      // contadores: entran y cuentan hasta su valor
      const cuenta = (sel, t, hasta, fmt) => {
        const o = { v: 0 }; const el = document.querySelector(sel + " b");
        tl.fromTo(sel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.to(o, { v: hasta, duration: 0.9, ease: "power2.out", onUpdate: () => { el.textContent = fmt(Math.round(o.v)); } }, t);
      };
      cuenta("#c-personas", 9.6, 50000, v => "+" + v.toLocaleString("en-US"));
      cuenta("#c-empresas", 13.6, 70, v => "+" + v);
      cuenta("#c-eventos", 15.6, 10, v => "+" + v);
      cuenta("#c-paises", 17.6, 13, v => "" + v);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
